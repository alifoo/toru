<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toru</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:block;src:url(fonts/ibm-plex-sans-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:block;src:url(fonts/ibm-plex-sans-500.woff2) format("woff2")}
:root{color-scheme:light;--bg:#f5f8fa;--ink:#22313b;--muted:#64727d;--line:#cbd7df;--acid:#405f6d;--record:#d36b59;--amber:#9a6a24;--amber-bg:#f5ead6;--ready:#3f6b5c;--ready-bg:#e2eee8;--sans:"IBM Plex Sans","Avenir Next",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;width:320px;font:13px/1.5 var(--sans);color:var(--ink);background:radial-gradient(ellipse at 10% 0%,#dceaf2,transparent 60%),radial-gradient(ellipse at 100% 100%,#dcebe5,transparent 55%),var(--bg);-webkit-font-smoothing:antialiased}
main{padding:16px 16px 14px;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:21px;letter-spacing:-.07em}
.wordmark::before{content:"";width:17px;height:17px;border-radius:50%;border:1px solid #fff;background:radial-gradient(circle at 35% 25%,#fff 0%,#ebf5f7 22%,#90a9b5 48%,#f9ffff 53%,#647e8b 59%,#e9f2f7 69%,#fff 74%,#a5b8c2 100%);box-shadow:0 2px 5px #2a495326,inset 0 0 0 1px #829daa55}
header small{color:var(--muted);font-size:12px}
.card{display:grid;gap:8px;padding:14px;border-radius:18px;border:1px solid #fff;background:linear-gradient(135deg,#ffffffe0,#ffffff80);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 2px #aec3cf40,0 6px 18px #39546612}
.status{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:4px 11px 4px 9px;border-radius:999px;font-weight:500;font-size:12.5px;background:#eef3f6;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#a5b5bf}
.status[data-state=online]{background:var(--ready-bg);color:var(--ready)}.status[data-state=online] .dot{background:var(--ready)}
.status[data-state=recording]{background:#f8e4df;color:#9b4a3c}.status[data-state=recording] .dot{background:var(--record);box-shadow:0 0 0 4px #ce786326;animation:pulse 1.6s ease-in-out infinite}
.status[data-state=offline]{background:var(--amber-bg);color:var(--amber)}.status[data-state=offline] .dot{background:var(--amber);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
p{margin:0;color:var(--muted)}
.actions{display:grid;gap:8px}
form{display:flex;gap:6px}
input{flex:1;min-width:0;height:34px;padding:0 12px;border:1px solid #c8d7df;border-radius:12px;background:#ffffffb3;color:var(--ink);font:inherit;box-shadow:inset 0 1px 3px #587b8910}
input:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 3px #405f6d1f}
.primary,button{height:34px;padding:0 14px;border-radius:999px;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;border:1px solid #fff;background:linear-gradient(160deg,#ffffffed 5%,#f1f7f9b0 40%,#c7d9e3a8 100%);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px #688b9c38,0 0 0 1px #a7bdc657,0 3px 7px #354f6414;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.primary:hover,button:hover{background:linear-gradient(160deg,#fff,#d7e8ef);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px #688b9c38,0 0 0 1px #90aab8,0 5px 12px #354f6424}
.quiet{justify-self:start;height:auto;padding:2px 0;border:0;background:none;box-shadow:none;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.quiet:hover{background:none;box-shadow:none;color:var(--ink)}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
footer{display:flex;justify-content:space-between;color:var(--muted);font:11px ui-monospace,monospace}
footer a{color:var(--muted)}
[hidden]{display:none!important}
</style></head>
<body><main>
<header><span class="wordmark">toru</span><small>for Chrome</small></header>
<section class="card">
  <span class="status" id="status"><span class="dot"></span><span id="label">Loading…</span></span>
  <p id="help"></p>
</section>
<div class="actions" id="connect" hidden>
  <a class="primary" id="open" href="https://app.toru.tools/onboarding?path=chrome&amp;step=chrome" target="_blank" rel="noreferrer">Connect from your Toru account ↗</a>
  <span class="or">or paste a code</span>
  <form id="pair"><input id="code" placeholder="Pairing code" autocomplete="off" spellcheck="false"><button type="submit">Connect</button></form>
</div>
<button class="quiet" id="unpair" hidden>Disconnect this Chrome</button>
<footer><span id="meta"></span><a href="https://toru.tools/chrome" target="_blank" rel="noreferrer">Help</a></footer>
</main><script src="popup.js"></script></body></html>
