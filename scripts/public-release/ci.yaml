name: Engine checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: node scripts/smoke-navigation-recovery.mjs
      - run: node scripts/smoke-browser-supervision.mjs
      - run: pnpm audit --audit-level=high
      - run: docker build -t agent-recorder:ci .
